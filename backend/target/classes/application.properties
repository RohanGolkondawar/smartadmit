# Server
server.port=8080

# Database - PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/admission_db
spring.datasource.username=postgres
spring.datasource.password=rohan
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=smartadmit_jwt_secret_key_2024_must_be_at_least_32_chars_long
jwt.expiration=86400000

# CORS
cors.allowed-origins=http://localhost:5173

# Logging
logging.level.com.smartadmit=INFO
