# Server
server.port=${PORT:8080}

# Database — reads from environment variable on Render
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT — reads from environment variable on Render
jwt.secret=${JWT_SECRET:smartadmit_default_secret_key_change_in_production}
jwt.expiration=86400000

# CORS — reads from environment variable (your frontend URL)
cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# Logging
logging.level.com.smartadmit=INFO
